<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%">
  <defs>
    <style>
      .arrow { 
        fill: #d3d3d3; 
        stroke: #000000; 
        stroke-width: 1.5; 
        stroke-linejoin: round; 
      }
      .text-label { 
        font-family: Arial, Helvetica, sans-serif; 
        font-size: 28px; 
        text-anchor: middle; 
        fill: #000000; 
      }
    </style>
  </defs>

  <g transform="translate(440, 250) rotate(-90)">
