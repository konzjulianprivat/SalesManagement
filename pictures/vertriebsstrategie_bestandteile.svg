  </g>

  <g transform="translate(330, 90) rotate(117.7)">
    <polygon class="arrow" points="0,-12 400,-12 400,-25 450,0 400,25 400,12 0,12"/>
  </g>

  <text x="440" y="50" class="text-label">Sales partners</text>
